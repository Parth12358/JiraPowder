[package]
name = "blockmap"
version = "0.1.0"
description = "Read-only Jira blocker map over MCP"
authors = ["Parth Sanjay Kshirsagar"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
default-run = "blockmap"

[lib]
name = "blockmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blockmap"
path = "src/main.rs"
required-features = ["app"]

[[bin]]
name = "mcp_probe"
path = "src/bin/mcp_probe.rs"

# `app` pulls in Tauri (and the system webview). Everything else — MCP client, guard,
# JQL, normalizer, store — builds and tests without it: `cargo test --no-default-features`.
[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [], optional = true }
tauri-plugin-opener = { version = "~2.7", optional = true }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
