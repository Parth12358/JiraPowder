[package]
name = "jirapowder"
version = "0.2.0"
description = "Read-only Jira blocker map over MCP"
authors = ["Parth Sanjay Kshirsagar"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
default-run = "jirapowder"

[lib]
name = "jirapowder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jirapowder"
path = "src/main.rs"
required-features = ["app"]

# The Phase 2 probe is a cargo example (examples/mcp_probe.rs) rather than a [[bin]]: the Tauri
# bundler packages every bin target, and the universal macOS build failed on it.

# `app` pulls in Tauri (and the system webview). Everything else — MCP client, guard,
# JQL, normalizer, store — builds and tests without it: `cargo test --no-default-features`.
[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-plugin-opener", "dep:keyring"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [], optional = true }
tauri-plugin-opener = { version = "~2.7", optional = true }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
rmcp = { version = "~3.7", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "~1.54", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util"] }
thiserror = "~2.0"
regex = "~1.13"
anyhow = "~1.0"
process-wrap = { version = "~10.0", default-features = false, features = ["tokio1", "process-group"] }
# keyring 4 with its default `v1` feature keeps the classic Entry API (macOS Keychain on Mac).
keyring = { version = "~4.2", optional = true }

[dev-dependencies]
tempfile = "~3.27"
